<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia del LaserDisc - Timeline UOC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@knight-lab/timelinejs@3.9.13/dist/css/timeline.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #timeline-embed {
            width: 100%;
            height: 100vh;
        }
        .tl-media-image {
            max-height: 380px !important;
            object-fit: contain !important;
        }
        /* Capa superpuesta para el lightbox */
            .lightbox-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.88);
                z-index: 999999;
                justify-content: center;
                align-items: center;
                cursor: zoom-out;
            }

            .lightbox-overlay img {
                max-width: 90vw;
                max-height: 90vh;
                object-fit: contain;
                border-radius: 4px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            /* Indicar al usuario que las imágenes se pueden ampliar */
            .tl-media-image {
                cursor: zoom-in !important;
            }
    </style>
    <!-- Estilos oficiales de Timeline.js -->
    <link rel="stylesheet" href="timeline.css">  
</head>
<body>
    <div id="timeline-embed"></div>

    <!-- Script de carga de Timeline.js -->
    <script src="timeline.js"></script>
    <script type="text/javascript">
        window.timeline = new TL.Timeline('timeline-embed', 'timeline.json');
    </script>
    <!-- Contenedor oculto del lightbox -->
    <div id="lightbox" class="lightbox-overlay" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Ampliación de imagen">
    </div>
            <script>
        // Delegación de eventos para detectar clics en imágenes cargadas dinámicamente
        document.addEventListener('click', function (e) {
            const imagen = e.target.closest('#timeline-embed img');
            if (imagen) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imagen.src;
            lightbox.style.display = 'flex';
            }
        });
        </script>
</body>
</html>
